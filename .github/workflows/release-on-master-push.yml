name: Release on master push

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          tag="release-${GITHUB_RUN_NUMBER}-${short_sha}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists. Skipping."
            exit 0
          fi

          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
